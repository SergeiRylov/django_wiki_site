<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MarkdownEditor + Bootstrap 5</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/markdown-text-editor/dist/style.css" rel="stylesheet">
    <style>
        /* Небольшие правки для красивой интеграции с Bootstrap */
        .markdown-editor .editor-toolbar {
            border-radius: 0.375rem 0.375rem 0 0;
        }
        .markdown-editor .CodeMirror {
            border-radius: 0 0 0.375rem 0.375rem;
        }
    </style>
</head>
<body>
    <div class="container py-5">
        <div class="card shadow-sm">
            <div class="card-header bg-light">
                <h5 class="mb-0">Редактор Markdown</h5>
            </div>
            <div class="card-body">
                <form id="articleForm">
                    <div class="mb-3">
                        <label for="title" class="form-label">Заголовок</label>
                        <input type="text" class="form-control" id="title" placeholder="Введите заголовок">
                    </div>
                    <div class="mb-3">
                        <label for="editor" class="form-label">Содержание</label>
                        <textarea class="form-control" id="editor" name="content" rows="8"># Ваша статья

Начните писать здесь...</textarea>
                    </div>
                    <button type="submit" class="btn btn-success">Опубликовать</button>
                    <button type="button" class="btn btn-outline-secondary" onclick="alert(document.getElementById('editor').value)">Показать Markdown</button>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/markdown-text-editor"></script>
    <script>
        // Инициализация с колбэком
        const editor = new MarkdownEditor('#editor', {
            onChange(value) {
                console.log('Длина текста:', value.length);
            }
        });

        // Пример: отправка формы
        document.getElementById('articleForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const content = document.getElementById('editor').value;
            console.log('Отправляем:', content);
            alert('Контент отправлен! Проверьте консоль.');
        });
    </script>
</body>
</html>
